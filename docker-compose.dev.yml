services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zapping
      POSTGRES_PASSWORD: zapping
      POSTGRES_DB: zapping
    ports:
      - "5433:5432" # 5433 en el host: evita chocar con un Postgres local en 5432 (P-5)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapping -d zapping"]
      interval: 5s
      timeout: 3s
      retries: 10
