# Override de desarrollo sobre el compose base. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Solo declara las diferencias: build local, logs debug, segmentos montados
# desde el repo y el puerto de la DB expuesto para los tests de integración.
services:
  app:
    build: .
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./segments:/data/segments:ro

  db:
    ports:
      - "5433:5432" # 5433 en el host: evita chocar con un Postgres local en 5432 (P-5)
